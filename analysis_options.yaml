# Configures the analyzer, which statically checks the code for errors,
# warnings and lint violations. Run it with `flutter analyze`.
#
# Everything below is deliberately stricter than the Flutter defaults: the
# point is that a mistake is caught here rather than in review, or on a device.
include: package:flutter_lints/flutter.yaml

analyzer:
  language:
    # Refuse the implicit downcasts, inferred dynamics and raw generics that
    # otherwise let a type error survive until runtime.
    strict-casts: true
    strict-inference: true
    strict-raw-types: true

  errors:
    # An unawaited future is how a screen silently stops updating, so treat it
    # as something to fix rather than something to notice.
    unawaited_futures: error

  exclude:
    - build/**
    - android/**
    - ios/**
    - web/**
    - windows/**

linter:
  rules:
    # Imports stay grouped and alphabetical, so a merge conflict in the import
    # block is a real conflict rather than an ordering accident.
    - directives_ordering

    # House style the code already follows; enforcing it keeps it uniform.
    - prefer_single_quotes
    - prefer_final_locals
    - always_declare_return_types
    - unnecessary_parenthesis

    # Futures are the app's main source of ordering bugs.
    - unawaited_futures
    - avoid_void_async

    # Widgets rebuild constantly; const constructors keep that cheap.
    - prefer_const_constructors
    - prefer_const_declarations
    - prefer_const_literals_to_create_immutables
